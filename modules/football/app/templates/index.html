<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forekto — Football Match Predictor</title>
  <style>
    :root{
      --bg:#f4f6f9; --panel:#fff; --panel-2:#f8fafc; --line:#e1e7ef;
      --text:#15202b; --muted:#687787; --green:#1a9b55; --green-d:#127a42;
      --home:#1a9b55; --draw:#687787; --away:#185fa5; --gold:#c8911a; --radius:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .top{background:var(--green-d);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px}
    .top h1{margin:0;font-size:22px}
    .top .pill{font-size:11px;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:1px}
    .top a{margin-left:auto;color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:999px}
    .sub{max-width:1000px;margin:0 auto;padding:16px 24px 0;color:var(--muted);font-size:14px}
    .wrap{max-width:1000px;margin:0 auto;padding:14px 24px 48px;display:flex;flex-direction:column;gap:20px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(20,32,43,.04)}
    .card h2{margin:0 0 16px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
    input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--text);outline:none}
    input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,155,85,.12)}
    .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-bottom:18px}
    .vs{color:var(--muted);font-weight:700;padding-bottom:9px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
    .sec-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
    .btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;margin-top:16px}
    .btn:hover{background:var(--green-d)}
    .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
    .error{color:#c0392b}
    .outcome{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
    .outcome .nm{font-size:16px;font-weight:600}
    .outcome .sub2{font-size:12px;color:var(--muted)}
    .outcome .pv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
    .outcome .track{grid-column:1/4;height:9px;background:#eef1f5;border-radius:999px;overflow:hidden;margin-top:4px}
    .outcome .track>i{display:block;height:100%}
    .outcome.top{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
    .badge{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;margin-left:8px}
    .empty{color:var(--muted);font-size:14px;padding:20px 4px}
    .foot{color:var(--muted);font-size:12px;margin-top:10px}
  </style>
</head>
<body>
  <div class="top"><h1>Forekto</h1><span class="pill">Football</span>
    <a href="/dashboard">Accuracy dashboard →</a>
  </div>
  <div class="sub">Predict the 1X2 outcome of a match — Home win, Draw, or Away win — from recent form, league position and the market odds.</div>

  <div class="wrap">
    <section class="card">
      <h2>Match</h2>
      <div class="teams">
        <div><label>Home team</label><input id="home_team" value="Team A" /></div>
        <div class="vs">vs</div>
        <div><label>Away team</label><input id="away_team" value="Team B" /></div>
      </div>

      <div class="sec-label">Home form (last 5)</div>
      <div class="grid">
        <div><label>Pts / game</label><input id="home_form_points" type="number" step="0.1" value="2.0" /></div>
        <div><label>Goals for</label><input id="home_form_gf" type="number" step="0.1" value="1.8" /></div>
        <div><label>Goals against</label><input id="home_form_ga" type="number" step="0.1" value="0.9" /></div>
        <div><label>League rank</label><input id="home_rank" type="number" value="3" /></div>
      </div>

      <div class="sec-label">Away form (last 5)</div>
      <div class="grid">
        <div><label>Pts / game</label><input id="away_form_points" type="number" step="0.1" value="1.2" /></div>
        <div><label>Goals for</label><input id="away_form_gf" type="number" step="0.1" value="1.1" /></div>
        <div><label>Goals against</label><input id="away_form_ga" type="number" step="0.1" value="1.4" /></div>
        <div><label>League rank</label><input id="away_rank" type="number" value="11" /></div>
      </div>

      <div class="sec-label">Market odds</div>
      <div class="grid">
        <div><label>Home win</label><input id="home_odds" type="number" step="0.01" value="1.9" /></div>
        <div><label>Draw</label><input id="draw_odds" type="number" step="0.01" value="3.5" /></div>
        <div><label>Away win</label><input id="away_odds" type="number" step="0.01" value="4.2" /></div>
      </div>

      <button class="btn" id="predict">Predict outcome</button>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h2>Prediction</h2>
      <div id="results"><div class="empty">Fill the match details and hit <strong>Predict outcome</strong>.</div></div>
    </section>
  </div>

  <script>
    const COLORS = {"Home win":"var(--home)","Draw":"var(--draw)","Away win":"var(--away)"};
    function num(id){ return Number(document.getElementById(id).value); }
    function collect(){
      return {
        home_team: document.getElementById("home_team").value,
        away_team: document.getElementById("away_team").value,
        home_form_points:num("home_form_points"), away_form_points:num("away_form_points"),
        home_form_gf:num("home_form_gf"), home_form_ga:num("home_form_ga"),
        away_form_gf:num("away_form_gf"), away_form_ga:num("away_form_ga"),
        home_rank:num("home_rank"), away_rank:num("away_rank"),
        home_odds:num("home_odds"), draw_odds:num("draw_odds"), away_odds:num("away_odds"),
      };
    }
    async function predict(){
      const status=document.getElementById("status");
      status.textContent="Scoring match…";
      try{
        const res=await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(collect())});
        const data=await res.json();
        if(!res.ok){status.innerHTML='<span class="error">'+(data.error||"Error")+'</span>';return;}
        status.textContent="";
        render(data);
      }catch(e){status.innerHTML='<span class="error">Request failed: '+e.message+'</span>';}
    }
    function render(data){
      const rows=data.ranked.map(r=>{
        const pctv=(r.win_probability*100).toFixed(1);
        const top=r.rank===1;
        return `<div class="outcome ${top?'top':''}">
          <div class="pv" style="font-size:20px;color:var(--muted)">${r.rank}</div>
          <div><div class="nm">${r.name}${top?'<span class="badge">Most likely</span>':''}</div>
            <div class="sub2">Odds ${r.win_odds!=null?r.win_odds:'—'}</div></div>
          <div class="pv">${pctv}%</div>
          <div class="track"><i style="width:${pctv}%;background:${COLORS[r.name]||'var(--green)'}"></i></div>
        </div>`;
      }).join("");
      document.getElementById("results").innerHTML = `<div style="font-weight:600;margin-bottom:12px">${data.match}</div>` + rows +
        `<div class="foot">Probabilities sum to ~100% · ML demonstration, not betting advice.</div>`;
    }
    document.getElementById("predict").onclick=predict;
  </script>
</body>
</html>

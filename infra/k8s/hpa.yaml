# Autoscale the deployment on CPU. Requires metrics-server in the cluster
# (EKS: add-on; kind: `kubectl apply` the metrics-server manifest — see DEMO.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: horse-racing
  namespace: forekto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: horse-racing
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

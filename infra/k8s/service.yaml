apiVersion: v1
kind: Service
metadata:
  name: horse-racing
  namespace: forekto
  labels:
    app.kubernetes.io/name: horse-racing
spec:
  # ClusterIP is internal. On EKS you'd put an Ingress/ALB in front; locally
  # you reach it with `kubectl port-forward`.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horse-racing
  ports:
    - name: http
      port: 80
      targetPort: 8080

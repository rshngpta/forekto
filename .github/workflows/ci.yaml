name: CI

# Runs on every push and pull request that touches the horse-racing module.
on:
  push:
    branches: [main]
    paths:
      - "modules/horse-racing/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "modules/horse-racing/**"
      - ".github/workflows/ci.yaml"

defaults:
  run:
    working-directory: modules/horse-racing

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/horse-racing/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app ml tests --max-line-length=100

      - name: Test (pytest)
        run: pytest -q

  docker-build-scan:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A model file is needed inside the image. We generate a model at build
      # time from synthetic data so CI never depends on the real dataset.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a model artifact for the image
        run: |
          pip install -r requirements.txt
          python ml/make_sample_data.py
          python ml/train.py

      - name: Build Docker image
        run: docker build -t forekto-horse-racing:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: forekto-horse-racing:${{ github.sha }}
          format: table
          # Report findings but do not fail the build on CVEs in base images.
          # Flip exit-code to "1" to make vulnerabilities a hard gate.
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
